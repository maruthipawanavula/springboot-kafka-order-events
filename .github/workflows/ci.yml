name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The test suite is unit and MockMvc slice tests only, so the full
      # verify runs without Kafka or Postgres services.
      - name: Build and verify
        run: mvn -B verify
